<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیش‌نمایش نقشهٔ ترکیبی</title><style>body{margin:0;background:#17232b;color:#f2e8cd;font:14px Tahoma}nav{height:64px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-wrap:wrap}button,select{font:inherit;background:#293e48;color:#f2e8cd;border:1px solid #8e7c52;border-radius:8px;padding:9px}iframe{width:100%;height:calc(100dvh - 95px);border:0}small{display:block;text-align:center;height:24px}</style><nav><strong>پیش‌نمایش نقشهٔ ترکیبی</strong><select id="season"><option value="0">بهار</option><option value="1">تابستان</option><option value="2">پاییز</option><option value="3">زمستان</option></select><select id="castle"></select><button id="units">نمونهٔ ارتش و کشتی</button><button id="fit">نمای کامل</button></nav><small>اطلاعات این صفحه آزمایشی است · کشیدن برای جابه‌جایی، دو انگشت برای زوم</small><iframe id="map" src="index.html"></iframe><script>const frame=document.getElementById('map');let rows=[],state;const send=msg=>frame.contentWindow.postMessage(msg,location.origin);fetch('review-data.json').then(r=>r.json()).then(data=>{rows=data;document.getElementById('castle').innerHTML=rows.map(p=>'<option>'+p.name+'</option>').join('');state={castles:rows.map(p=>({name:p.sourceMap?.name||p.name,region:p.region,owner:{region:p.region,name:'پیش‌نمایش'}})),effects:[],campaigns:[],filters:{},now:Date.now()};send({type:'valyria-map-state',state})});window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;if(e.data.type==='valyria-map-ready'&&state)send({type:'valyria-map-state',state});if(e.data.type==='valyria-map-castle')document.getElementById('castle').value=rows.find(p=>(p.sourceMap?.name||p.name)===e.data.name)?.name||''});document.getElementById('season').onchange=e=>send({type:'valyria-map-season',season:e.target.value});document.getElementById('castle').onchange=e=>{const p=rows.find(p=>p.name===e.target.value);send({type:'valyria-map-focus',name:p.sourceMap?.name||p.name})};document.getElementById('units').onclick=()=>{state.campaigns=[{id:'demo-land',name:'ارتش زمینی آزمایشی',previewPose:{position:[.25,.04,.70],end:[.29,.04,.70],heading:-1.57,sea:false,size:.035}},{id:'demo-sea',name:'کشتی آزمایشی',previewPose:{position:[.47,.034,.76],end:[.53,.034,.76],heading:-1.57,sea:true,size:.045}}];send({type:'valyria-map-state',state});send({type:'valyria-map-demo-focus'})};document.getElementById('fit').onclick=()=>send({type:'valyria-map-fit'});setInterval(()=>{if(state){state.now=Date.now();send({type:'valyria-map-state',state})}},1000);</script></html>
