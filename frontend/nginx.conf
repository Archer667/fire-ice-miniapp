server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. {
        return 404;
    }

    location ~* \.(?:map|py|pyc|sqlite|sqlite3|db|bak|sql)$ {
        return 404;
    }

    location ~ ^/(?:src|backend|node_modules)(?:/|$) {
        return 404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /precache.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /map-pack.json {
        return 404;
    }
    location = /map-pack-core.js {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /westeros/v6/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
